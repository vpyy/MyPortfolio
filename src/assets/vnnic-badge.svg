<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f2b38" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02aab0" />
      <stop offset="100%" stop-color="#00cdac" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="400" rx="20" fill="url(#bgGrad)" />
  <rect width="598" height="398" x="1" y="1" rx="19" fill="none" stroke="rgba(2, 170, 176, 0.3)" stroke-width="2" />

  <!-- Network Grid Background Lines -->
  <g opacity="0.12" stroke="#00cdac" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
  </g>

  <!-- Glowing Orb / Tech Accent -->
  <circle cx="500" cy="90" r="80" fill="#02aab0" opacity="0.15" filter="url(#glow)" />
  <circle cx="100" cy="320" r="60" fill="#00cdac" opacity="0.1" filter="url(#glow)" />

  <!-- Network Nodes & Constellation -->
  <g stroke="#02aab0" stroke-width="1.5" opacity="0.4" fill="none">
    <line x1="420" y1="80" x2="480" y2="120" />
    <line x1="480" y1="120" x2="540" y2="70" />
    <line x1="480" y1="120" x2="460" y2="180" />
    <line x1="460" y1="180" x2="530" y2="190" />
  </g>
  <circle cx="420" cy="80" r="4" fill="#00cdac" />
  <circle cx="480" cy="120" r="5" fill="#38bdf8" />
  <circle cx="540" cy="70" r="3.5" fill="#00cdac" />
  <circle cx="460" cy="180" r="4" fill="#38bdf8" />
  <circle cx="530" cy="190" r="4" fill="#00cdac" />

  <!-- Top Status Badge -->
  <g transform="translate(40, 36)">
    <rect width="180" height="30" rx="15" fill="rgba(2, 170, 176, 0.15)" stroke="#02aab0" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#10b981" />
    <text x="30" y="20" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">NATIONAL INFRASTRUCTURE</text>
  </g>

  <!-- Organization Logo & Name Header -->
  <g transform="translate(40, 95)">
    <!-- Shield / Globe Emblem Icon -->
    <rect width="64" height="64" rx="14" fill="url(#tealGrad)" />
    <path d="M 22 32 L 28 38 L 42 24" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- VNNIC Bold Acronym -->
    <text x="80" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="2">VNNIC</text>
    <text x="82" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Vietnam Internet Network Information Center</text>
  </g>

  <!-- Subtitle / Ministry Information -->
  <text x="40" y="195" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">MINISTRY OF INFORMATION AND COMMUNICATIONS</text>

  <!-- Key Pillars / Feature Badges -->
  <g transform="translate(40, 225)">
    <!-- Pillar 1: .VN ccTLD -->
    <g transform="translate(0, 0)">
      <rect width="160" height="70" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="28" fill="#00cdac" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800">.VN Domain</text>
      <text x="16" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">National DNS Systems</text>
    </g>

    <!-- Pillar 2: VNIX -->
    <g transform="translate(180, 0)">
      <rect width="160" height="70" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800">VNIX Exchange</text>
      <text x="16" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">National Internet Hub</text>
    </g>

    <!-- Pillar 3: IPv6 & Security -->
    <g transform="translate(360, 0)">
      <rect width="160" height="70" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="16" y="28" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="800">IPv6 / DNSSEC</text>
      <text x="16" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Next-Gen Internet Protocol</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(40, 325)">
    <rect width="520" height="45" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(2, 170, 176, 0.25)" stroke-width="1" />
    <!-- Term -->
    <text x="20" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700">ROLE:</text>
    <text x="65" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">Software Engineer Intern</text>
    <!-- Divider -->
    <circle cx="250" cy="23" r="2.5" fill="#475569" />
    <!-- Location -->
    <text x="265" y="27" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700">BRANCH:</text>
    <text x="325" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">Da Nang, Vietnam</text>
    <!-- Live indicator -->
    <rect x="440" y="12" width="65" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
    <text x="453" y="27" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="800">ACTIVE</text>
  </g>
</svg>


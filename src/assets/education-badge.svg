<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02aab0" />
      <stop offset="100%" stop-color="#00cdac" />
    </linearGradient>
    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="eduGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="20" fill="url(#eduBg)" />
  <rect width="598" height="398" x="1" y="1" rx="19" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />

  <!-- Ambient light -->
  <circle cx="520" cy="80" r="70" fill="#38bdf8" opacity="0.12" filter="url(#eduGlow)" />
  <circle cx="80" cy="320" r="60" fill="#8b5cf6" opacity="0.1" filter="url(#eduGlow)" />

  <!-- Top Pill -->
  <g transform="translate(40, 36)">
    <rect width="190" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4" fill="#38bdf8" />
    <text x="30" y="20" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">HIGHER EDUCATION</text>
  </g>

  <!-- University Header -->
  <g transform="translate(40, 92)">
    <!-- Graduation Cap Emblem -->
    <rect width="64" height="64" rx="14" fill="url(#accentGrad)" />
    <!-- Cap icon -->
    <path d="M 16 30 L 32 20 L 48 30 L 32 40 Z" fill="#ffffff" />
    <path d="M 22 35 L 22 46 C 22 50, 42 50, 42 46 L 42 35" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M 45 32 L 45 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <text x="80" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="800">The University of Danang</text>
    <text x="80" y="54" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="600">University of Technology and Education (UTE - UD)</text>
  </g>

  <!-- Degree & GPA Row -->
  <g transform="translate(40, 185)">
    <!-- Degree Card -->
    <rect width="320" height="74" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="20" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">Engineer in Information Tech</text>
    <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500">Graduation: May 2027 (Senior Student)</text>

    <!-- GPA Highlight Pill -->
    <g transform="translate(335, 0)">
      <rect width="185" height="74" rx="12" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" />
      <text x="20" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700">CUMULATIVE GPA</text>
      <text x="20" y="56" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="900">3.52 <tspan font-size="14" font-weight="600" fill="#94a3b8">/ 4.0</tspan></text>
    </g>
  </g>

  <!-- Certifications Header & Cards -->
  <text x="40" y="292" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">OFFICIAL CERTIFICATIONS</text>

  <g transform="translate(40, 308)">
    <!-- Cert 1: TOEIC 765 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="62" rx="12" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(2, 170, 176, 0.4)" stroke-width="1" />
      <circle cx="28" cy="31" r="16" fill="url(#accentGrad)" />
      <text x="28" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">EN</text>
      <text x="54" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800">TOEIC 765 Score</text>
      <text x="54" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Listening &amp; Reading (2026-2028)</text>
    </g>

    <!-- Cert 2: Gemini Certified -->
    <g transform="translate(265, 0)">
      <rect width="255" height="62" rx="12" fill="rgba(30, 41, 59, 0.9)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />
      <circle cx="28" cy="31" r="16" fill="url(#purpleGrad)" />
      <text x="28" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">AI</text>
      <text x="54" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800">Gemini Certified</text>
      <text x="54" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500">Google Gemini Student (2025-2028)</text>
    </g>
  </g>
</svg>

